argo-cd:
  configs:
    params:
      server.insecure: true
    cm:
      timeout.reconciliation: 60s
      url: https://argocd.uttutu.xyz
      # NEW: Add tenant account (login = can log in to UI, apiKey = can generate tokens)
      accounts.tenant: "apiKey, login"
      rbac:
      # NEW: Bind tenant to the built-in readonly role
      policy.csv: |
        g, tenant, role:readonly
      # Default role for all authenticated users (readonly is the most restrictive)
      policy.default: role:readonly
      scopes: '[groups]'
  server:
    replicas: 1
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hostname: argocd.uttutu.xyz
      tls: true 
  dex:
    enabled: false
  redis-ha:
    enabled: false
  controller:
    replicas: 1
  repoServer:
    serviceAccount:
      create: false
    replicas: 1
  applicationSet:
    replicas: 1
  notifications:
    enabled: false
