tenant_rbac:
  # Namespaces the tenant can deploy to
  namespaces:
    - iresharma

  # Kubernetes RBAC subject (maps to ArgoCD username)
  subject:
    kind: User
    name: tenant

  # ArgoCD AppProject configuration
  project:
    name: tenant
    gitRepo: "https://github.com/utkarsh-homelab/homelab-gitops-tenant"

  # Resource quotas per namespace
  resourceQuota:
    requests:
      cpu: "4"
      memory: 12Gi
      storage: 75Gi
    limits:
      cpu: "4"
      memory: 12Gi
    pods: "50"
    persistentvolumeclaims: "10"

  # Limit ranges for containers
  limitRange:
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "1"
      memory: 4Gi
    min:
      cpu: 50m
      memory: 32Mi