tenant_rbac:
  # Namespaces the tenant can deploy to
  namespaces:
    - iresharma

  # Kubernetes RBAC subject (maps to ArgoCD username)
  subject:
    kind: User
    name: tenant

  # Narrow Role/RoleBinding grants for specific in-namespace ServiceAccounts
  # (not the tenant's own identity above) — see
  # templates/namespace-serviceaccount-roles.yaml for why these can't be
  # self-granted by the tenant and have to live here instead.
  serviceAccountRoles:
    # tracer-agent (github.com/iresharma/tracer) runs as a Deployment (not
    # a hostPath DaemonSet — the iresharma namespace enforces Pod Security
    # "baseline", which rejects hostPath outright) that watches Pods and
    # streams container logs via the pods/log subresource, the same
    # mechanism `kubectl logs -f` uses. It only ever sees pods already
    # inside "iresharma".
    - namespace: iresharma
      serviceAccount: tracer-agent
      name: tracer-agent-pod-logs
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]

  # ArgoCD AppProject configuration
  project:
    name: tenant
    gitRepo: "https://github.com/utkarsh-homelab/homelab-gitops-tenant"

  # Resource quotas per namespace
  resourceQuota:
    requests:
      cpu: "4"
      memory: 12Gi
      storage: 75Gi
    limits:
      cpu: "4"
      memory: 12Gi
    pods: "50"
    persistentvolumeclaims: "10"

  # Limit ranges for containers
  limitRange:
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "1"
      memory: 4Gi
    min:
      cpu: 50m
      memory: 32Mi