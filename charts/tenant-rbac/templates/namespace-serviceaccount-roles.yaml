# Narrowly-scoped Role/RoleBinding grants for specific in-namespace
# ServiceAccounts (as opposed to the tenant's own human/ArgoCD identity,
# see namespace-roles.yaml + namespace-role-bindings.yaml).
#
# The tenant-admin Role deliberately excludes the rbac.authorization.k8s.io
# apiGroup, so the tenant identity itself cannot create Roles/RoleBindings
# in its own namespace (`kubectl auth can-i create roles -n <ns>` -> no) —
# that's an intentional boundary, not a gap, since allowing it would let a
# tenant self-escalate. When an app running as its own ServiceAccount needs
# narrow Kubernetes API access (e.g. reading its own namespace's pod logs),
# this chart — applied with the rights to manage RBAC — is where that grant
# has to be defined.
{{- range $.Values.tenant_rbac.serviceAccountRoles }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
rules:
{{ toYaml .rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .name }}
subjects:
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ .namespace }}
---
{{- end }}
